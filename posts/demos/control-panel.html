<div class="controls">
    <div class="knob-row">
        <div class="knob-unit mode">
            <div class="knob-well">
                <div class="knob-scale">
                <span class="mark" style="--k: 0"><span class="tick"></span><span class="num">0</span></span>
                <span class="mark" style="--k: 1"><span class="tick"></span><span class="num">1</span></span>
                <span class="mark" style="--k: 2"><span class="tick"></span><span class="num">2</span></span>
                <span class="mark" style="--k: 3"><span class="tick"></span><span class="num">3</span></span>
                <span class="mark" style="--k: 4"><span class="tick"></span><span class="num">4</span></span>
                <span class="mark" style="--k: 5"><span class="tick"></span><span class="num">5</span></span>
                <span class="mark" style="--k: 6"><span class="tick"></span><span class="num">6</span></span>
                <span class="mark" style="--k: 7"><span class="tick"></span><span class="num">7</span></span>
                <span class="mark" style="--k: 8"><span class="tick"></span><span class="num">8</span></span>
                <span class="mark" style="--k: 9"><span class="tick"></span><span class="num">9</span></span>
                <span class="mark" style="--k: 10"><span class="tick"></span><span class="num">10</span></span>
                </div>
                <div class="knob dark">
                    <span class="knob-cap"></span>
                    <span class="knob-rotor"><span class="knob-notch"></span><span class="knob-indicator"></span></span>
                </div>
                <input class="knob-input" type="range" min="0" max="10" step="1" value="3" aria-label="Mode">
            </div>
        </div>
        <div class="knob-unit gain">
            <div class="knob-well">
                <div class="knob-scale">
                <span class="led" style="--k: 0"></span>
                <span class="led" style="--k: 1"></span>
                <span class="led" style="--k: 2"></span>
                <span class="led" style="--k: 3"></span>
                <span class="led" style="--k: 4"></span>
                <span class="led" style="--k: 5"></span>
                <span class="led" style="--k: 6"></span>
                <span class="led" style="--k: 7"></span>
                <span class="led" style="--k: 8"></span>
                <span class="led" style="--k: 9"></span>
                <span class="led" style="--k: 10"></span>
                <span class="led" style="--k: 11"></span>
                <span class="led" style="--k: 12"></span>
                <span class="led" style="--k: 13"></span>
                <span class="led" style="--k: 14"></span>
                <span class="led" style="--k: 15"></span>
                <span class="led" style="--k: 16"></span>
                <span class="led" style="--k: 17"></span>
                <span class="led" style="--k: 18"></span>
                <span class="led" style="--k: 19"></span>
                <span class="led" style="--k: 20"></span>
                </div>
                <div class="knob orange">
                    <span class="knob-cap"></span>
                    <span class="knob-rotor"><span class="knob-notch"></span><span class="knob-indicator"></span></span>
                </div>
                <input class="knob-input" type="range" min="0" max="100" step="1" value="60" aria-label="Gain">
            </div>
        </div>
    </div>

    <div class="wave-unit">
        <div class="selector" role="radiogroup" aria-label="Wave">
            <label class="sel-item">
                <span class="led"></span>
                <span class="button"><input class="sr-radio" type="radio" name="wave" value="sin" checked><span class="button-inside dark">1</span></span>
            </label>
            <label class="sel-item">
                <span class="led"></span>
                <span class="button"><input class="sr-radio" type="radio" name="wave" value="tri"><span class="button-inside dark">2</span></span>
            </label>
            <label class="sel-item">
                <span class="led"></span>
                <span class="button"><input class="sr-radio" type="radio" name="wave" value="saw"><span class="button-inside mid">3</span></span>
            </label>
            <label class="sel-item">
                <span class="led"></span>
                <span class="button"><input class="sr-radio" type="radio" name="wave" value="sqr"><span class="button-inside">4</span></span>
            </label>
        </div>
    </div>

    <div class="button-grid">
        <div class="buttons-container">
            <button class="button" type="button">
                <span class="button-inside dark">1</span>
            </button>
        </div>
        <div class="buttons-container">
            <button class="button" type="button">
                <span class="button-inside mid">2</span>
            </button>
        </div>
        <div class="buttons-container">
            <button class="button" type="button">
                <span class="button-inside light">3</span>
            </button>
        </div>
        <div class="buttons-container">
            <button class="button" type="button">
                <span class="button-inside">4</span>
            </button>
        </div>
    </div>

    <div class="fader-row">
        <div class="fader-unit">
            <div class="fader">
                <div class="fader-scale">
                    <span class="mark major" style="--k: 0"><span class="num">0</span></span>
                <span class="mark" style="--k: 1"></span>
                <span class="mark major" style="--k: 2"><span class="num">1</span></span>
                <span class="mark" style="--k: 3"></span>
                <span class="mark major" style="--k: 4"><span class="num">2</span></span>
                <span class="mark" style="--k: 5"></span>
                <span class="mark major" style="--k: 6"><span class="num">3</span></span>
                <span class="mark" style="--k: 7"></span>
                <span class="mark major" style="--k: 8"><span class="num">4</span></span>
                <span class="mark" style="--k: 9"></span>
                <span class="mark major" style="--k: 10"><span class="num">5</span></span>
                <span class="mark" style="--k: 11"></span>
                <span class="mark major" style="--k: 12"><span class="num">6</span></span>
                <span class="mark" style="--k: 13"></span>
                <span class="mark major" style="--k: 14"><span class="num">7</span></span>
                <span class="mark" style="--k: 15"></span>
                <span class="mark major" style="--k: 16"><span class="num">8</span></span>
                <span class="mark" style="--k: 17"></span>
                <span class="mark major" style="--k: 18"><span class="num">9</span></span>
                <span class="mark" style="--k: 19"></span>
                <span class="mark major" style="--k: 20"><span class="num">10</span></span>
                </div>
                <div class="fader-slot"></div>
                <input class="fader-input" type="range" min="0" max="100" step="1" value="70" aria-label="Level">
            </div>
            <span class="lamp"><span class="lamp-glass"></span></span>
        </div>
        <div class="fader-unit white">
            <div class="fader">
                <div class="fader-scale">
                    <span class="mark major" style="--k: 0"><span class="num">0</span></span>
                <span class="mark" style="--k: 1"></span>
                <span class="mark major" style="--k: 2"><span class="num">1</span></span>
                <span class="mark" style="--k: 3"></span>
                <span class="mark major" style="--k: 4"><span class="num">2</span></span>
                <span class="mark" style="--k: 5"></span>
                <span class="mark major" style="--k: 6"><span class="num">3</span></span>
                <span class="mark" style="--k: 7"></span>
                <span class="mark major" style="--k: 8"><span class="num">4</span></span>
                <span class="mark" style="--k: 9"></span>
                <span class="mark major" style="--k: 10"><span class="num">5</span></span>
                <span class="mark" style="--k: 11"></span>
                <span class="mark major" style="--k: 12"><span class="num">6</span></span>
                <span class="mark" style="--k: 13"></span>
                <span class="mark major" style="--k: 14"><span class="num">7</span></span>
                <span class="mark" style="--k: 15"></span>
                <span class="mark major" style="--k: 16"><span class="num">8</span></span>
                <span class="mark" style="--k: 17"></span>
                <span class="mark major" style="--k: 18"><span class="num">9</span></span>
                <span class="mark" style="--k: 19"></span>
                <span class="mark major" style="--k: 20"><span class="num">10</span></span>
                </div>
                <div class="fader-slot"></div>
                <input class="fader-input" type="range" min="0" max="100" step="1" value="40" aria-label="Light">
            </div>
            <span class="lamp"><span class="lamp-glass"></span></span>
        </div>
    </div>
</div>
